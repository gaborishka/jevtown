<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- head -->
    <meta name="theme-color" content="#090b10" />
    <meta name="application-name" content="Jevtown" />
    <meta name="apple-mobile-web-app-title" content="Jevtown" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#ED6CA2" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <nav class="nav">
        <a class="brand" href="/" data-link aria-label="Jevtown">
          <picture>
            <source media="(max-width: 340px)" srcset="/brand/mark-dark.svg" />
            <img id="brand" class="logo" src="/brand/logo-dark.svg" alt="Jevtown" width="145" height="38" />
          </picture>
        </a>
        <div id="nav" class="nav-links"></div>
        <div id="lang" class="lang" role="group" aria-label="Language"></div>
      </nav>
      <main id="view"></main>
      <footer class="foot">
        <p id="about" class="about"></p>
        <p class="about"><a href="https://github.com/gaborishka/jevtown" rel="noopener">GitHub</a> · <a href="https://typesafe.ai" rel="noopener">Jev</a></p>
      </footer>
    </div>
    <div id="tip" class="tip" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
